[package]
name = "gitpar-desktop"
version = "1.3.0"
description = "Standalone desktop shell for GitPar"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "gitpar-desktop"
path = "src/main.rs"
