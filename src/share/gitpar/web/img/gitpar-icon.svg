<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="GitPar">
  <!-- A commit resting level with a datum bar: at par. The bar is the
       standard and stays quiet; the commit is the subject. -->
  <rect width="64" height="64" rx="14" fill="#16202b"/>
  <line x1="7" y1="27" x2="57" y2="27" stroke="#9fb6cc" stroke-width="5" stroke-linecap="round"/>
  <line x1="32" y1="27" x2="32" y2="52" stroke="#fd8c25" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="32" cy="27" r="6.5" fill="#fd8c25"/>
</svg>
